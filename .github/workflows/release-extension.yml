name: Release Extension

# Handles releases created by a human (a "release: published" event). Automated release
# candidates do NOT reach this workflow: release-candidate.yml creates them with the
# built-in GITHUB_TOKEN, and GitHub's anti-recursion rule means a GITHUB_TOKEN-created
# release never fires "release: published" for another workflow -- so release-candidate.yml
# builds, tests, packages, and attaches the RC zip itself.
#
#   - Promoting to a real release: manually create a new GitHub Release targeting an RC's
#     commit, with a clean tag ("vX.Y.Z", no "-<build>" suffix) and "Set as a pre-release"
#     unchecked. Because a human created it, it fires this workflow: build, test, package,
#     attach the zip, and -- because it is not a prerelease -- deploy to the Chrome Web Store.
#   - A prerelease created manually in the GitHub UI (or a workflow_dispatch run) also fires
#     this workflow but stops after packaging; only a non-prerelease publish deploys.
#
# Whether the store-deploy job runs is decided by the release's `prerelease` flag -- see the
# "publish-to-chrome-web-store" job's `if:`. Tests must pass in `verify` before either path
# packages or deploys anything.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Also upload the package to the Chrome Web Store and Microsoft Edge Add-ons store (requires the respective CHROME_*/EDGE_* secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        # Excludes the timing-based performance guards: this solution-wide run executes the suites
        # in parallel on a shared runner, so their budgets would measure contention and fail at
        # random. Performance is gated by the dedicated `perf` job in ci.yml instead.
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Performance"

  package:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.manifest_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Determine the version to package
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag_name="$TAG_NAME"       # e.g. v1.0.1-57 or v1.0.1
            version_part="${tag_name#v}"
            if [[ "$version_part" == *-* ]]; then
              base_version="${version_part%%-*}"                  # 1.0.1
              build_id="${version_part#*-}"                        # 57
              manifest_version="${base_version}.${build_id}"       # 1.0.1.57 (Chrome allows up to 4 parts)
            else
              manifest_version="$version_part"                    # 1.0.1
            fi
            is_prerelease="$RELEASE_PRERELEASE"

            # A non-prerelease publish deploys to the Chrome Web Store -- refuse to do
            # that for anything but a clean "vX.Y.Z" tag, so an RC-style tag can never
            # accidentally ship just because someone unchecked "pre-release" by mistake.
            if [[ "$is_prerelease" == "false" && ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$tag_name' is not a plain vX.Y.Z tag but this release isn't marked as a pre-release. Refusing to publish a release-candidate-style tag as a final release."
              exit 1
            fi
          else
            # workflow_dispatch: leave manifest.json's committed version as-is.
            manifest_version=""
            is_prerelease="true"
          fi
          echo "manifest_version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Stamp manifest.json with the release version
        if: steps.version.outputs.manifest_version != ''
        run: |
          python3 - "${{ steps.version.outputs.manifest_version }}" <<'EOF'
          import json
          import sys

          path = "extension/manifest.json"
          with open(path) as f:
              manifest = json.load(f)
          manifest["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF

      - name: Package extension
        id: package
        run: ./scripts/package-extension.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-extension-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      # Same package, minus manifest.json's "key": the Microsoft Edge Add-ons store's validator
      # rejects a submission whose manifest has one (see package-edge-extension.sh). Built from the
      # Chrome zip above rather than from extension/ directly so the two can never drift apart.
      - name: Package Edge extension
        id: package_edge
        run: ./scripts/package-edge-extension.sh "${{ steps.package.outputs.zip_path }}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-extension-edge-v${{ steps.package_edge.outputs.version }}
          path: ${{ steps.package_edge.outputs.edge_zip_path }}
          if-no-files-found: error

      - name: Package all-in-one bundles (extension + native host, per platform)
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            ./scripts/package-bundle.sh "$rid" dist
          done

      # Scan the promotion's downloadable artifacts with VirusTotal before anything is attached or
      # deployed (#111) — the same gate release-candidate.yml applies to the RC, so a real release
      # (which deploys to the Chrome Web Store) is verified too, not just the candidate. Runs in the
      # `package` job that the store-deploy job depends on, so a detection fails packaging and the
      # deploy never runs. Skips with a notice if VT_API_KEY isn't set (mirrors the store-creds skip).
      - name: Scan release artifacts with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_MALICIOUS_THRESHOLD: "0"
        run: |
          shopt -s nullglob
          python3 scripts/scan-virustotal.py \
            dist/pdf-editor-extension-*.zip \
            dist/pdf-editor-bundle-*.zip

      # Best-effort. This workflow reacts to a release a human has already *published*, and this
      # repository has immutable releases enabled, so its assets are frozen the moment it exists —
      # softprops can neither overwrite nor add to them ("Cannot delete asset from an immutable
      # release"). That failure previously failed the whole `package` job and so blocked the Chrome
      # Web Store deploy below, which is the actual point of a promotion — v1.0.1 and v1.0.2 never
      # reached the store because of it. The deploy consumes the build artifact uploaded above, not
      # these release assets, so it does not need the attach to succeed. The standalone zips for a
      # promoted version live on its release-candidate prerelease, which is built as a draft and so
      # keeps its assets (see release-candidate.yml). Making the final release carry them too would
      # need this workflow to own the release as draft→publish rather than react to a published one.
      - name: Attach to the GitHub Release (best-effort; see note)
        if: github.event_name == 'release'
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/pdf-editor-extension-*.zip
            dist/pdf-editor-bundle-*.zip

  # Write the released version back to extension/manifest.json on the default branch.
  #
  # The stamp above lives only in the runner's checkout, so before this job the committed manifest
  # never moved: it still said 2.0.0 while v2.0.2 was the shipped release. Everything derived from
  # it inherited that — a host built from a clean checkout reported 2.0.0, and an unpacked
  # extension loaded from the repo showed 2.0.0 in chrome://extensions no matter how many releases
  # had gone out. Syncing it here keeps the repository's own number equal to the last thing
  # actually shipped.
  #
  # A separate job, deliberately: it must not sit between `package` and the Chrome Web Store
  # deploy, and a push that loses a race is not a reason to fail a release that already shipped.
  # Pushing with GITHUB_TOKEN does not fire another workflow (GitHub's anti-recursion rule), so
  # this commit does not cut a release candidate of its own.
  sync-manifest-version:
    needs: package
    # Final releases only. A prerelease (every RC) is not what the repository should claim to be.
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false && needs.package.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"

      - name: Sync extension/manifest.json to the released version
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" <<'EOF'
          import json
          import sys

          path = "extension/manifest.json"
          with open(path) as f:
              manifest = json.load(f)
          released = tuple(int(p) for p in sys.argv[1].split("."))
          committed = tuple(int(p) for p in manifest["version"].split("."))
          # Never walk the number backwards: the default branch may already carry a later version
          # than the release being published (a hotfix promoted out of order, or a manual bump).
          if committed >= released:
              print(f"manifest.json is already at {manifest['version']}; leaving it alone.")
              sys.exit(0)
          manifest["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(f"manifest.json: {'.'.join(map(str, committed))} -> {sys.argv[1]}")
          EOF

          if git diff --quiet -- extension/manifest.json; then
            echo "Nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "Sync extension/manifest.json to released v$RELEASE_VERSION"

          # Someone may have pushed while the release was building; rebase and retry rather than
          # failing a release whose artifacts are already out.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto $DEFAULT_BRANCH."
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; break; }
          done
          echo "::warning::Could not sync extension/manifest.json to v$RELEASE_VERSION on $DEFAULT_BRANCH; bump it by hand."

  publish-to-chrome-web-store:
    needs: package
    # Only a non-prerelease Release (the manual "promote" step) deploys to the store;
    # release candidates from release-candidate.yml are always prereleases and stop here.
    if: ${{ github.event.inputs.publish_to_store == 'true' || needs.package.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-editor-extension-v${{ needs.package.outputs.version }}
          path: dist
      - name: Check Chrome Web Store credentials are configured
        id: creds
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [[ -n "$EXTENSION_ID" && -n "$CLIENT_ID" \
                && -n "$CLIENT_SECRET" && -n "$REFRESH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Chrome Web Store upload — CHROME_EXTENSION_ID/CHROME_CLIENT_ID/CHROME_CLIENT_SECRET/CHROME_REFRESH_TOKEN secrets are not all set. The packaged zip is still available as a build artifact for manual upload."
          fi
      - name: Upload (and publish) to the Chrome Web Store
        if: steps.creds.outputs.configured == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          zip_path=$(ls dist/*.zip | head -1)
          # Install the pinned version explicitly (--ignore-scripts: it has no install-time
          # work to do), then invoke it with --no-install so npx never fetches on demand.
          npm install --no-save --ignore-scripts chrome-webstore-upload-cli@3.3.2
          npx --no-install chrome-webstore-upload-cli upload \
            --source "$zip_path" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
          npx --no-install chrome-webstore-upload-cli publish \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

  publish-to-edge-add-ons-store:
    needs: package
    # Same trigger as the Chrome Web Store deploy: only a non-prerelease Release (the manual
    # "promote" step), or an explicit workflow_dispatch opt-in.
    if: ${{ github.event.inputs.publish_to_store == 'true' || needs.package.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: edge-add-ons-store
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdf-editor-extension-edge-v${{ needs.package.outputs.version }}
          path: dist
      - name: Check Microsoft Edge Add-ons credentials are configured
        id: creds
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          if [[ -n "$PRODUCT_ID" && -n "$CLIENT_ID" && -n "$API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Microsoft Edge Add-ons upload — EDGE_PRODUCT_ID/EDGE_CLIENT_ID/EDGE_API_KEY secrets are not all set. The packaged zip is still available as a build artifact for manual upload."
          fi
      # Talks to the Edge Add-ons submission API (v1.1) directly with curl rather than a
      # third-party package or Action, matching how the Chrome Web Store step above avoids a
      # GitHub Marketplace Action -- one fewer opaque external dependency in a release pipeline.
      # v1.1 auth is just two headers (no OAuth token exchange, unlike the superseded v1 API):
      # https://learn.microsoft.com/microsoft-edge/extensions/update/api/using-addons-api
      - name: Upload (and publish) to the Microsoft Edge Add-ons store
        if: steps.creds.outputs.configured == 'true'
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          zip_path=$(ls dist/*.zip | head -1)
          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID"

          # operation_id <headers-file> -- the Location header's value IS the operation ID (not a
          # URL to follow); ${v##*/} also tolerates it arriving as a path/URL, harmlessly.
          operation_id() {
            local v
            v="$(grep -i '^Location:' "$1" | tr -d '\r' | awk '{print $2}')"
            echo "${v##*/}"
          }

          # poll <endpoint-template-with-%s> <operation-id> -- polls until the operation leaves
          # "InProgress". Edge's docs give no fixed SLA for package processing; 30 tries * 10s is a
          # generous 5-minute budget before failing loudly rather than hanging the job forever.
          poll() {
            local url status body
            url="$(printf "$1" "$2")"
            for _ in $(seq 1 30); do
              body="$(curl -sS -H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID" "$url")"
              status="$(echo "$body" | jq -r '.status // empty' 2>/dev/null)"
              case "$status" in
                Succeeded|Completed) echo "$status"; return 0 ;;
                Failed|Rejected) echo "error: operation failed: $body" >&2; return 1 ;;
              esac
              sleep 10
            done
            echo "error: operation did not finish in time: $body" >&2
            return 1
          }

          echo "Uploading $zip_path..."
          headers="$(mktemp)"
          curl -sS -X POST -H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID" \
            -H "Content-Type: application/zip" --data-binary "@$zip_path" \
            -D "$headers" -o /dev/null "$base/submissions/draft/package"
          upload_op="$(operation_id "$headers")"
          if [[ -z "$upload_op" ]]; then
            echo "error: upload did not return an operation Location header:" >&2
            cat "$headers" >&2
            exit 1
          fi
          echo "Upload accepted (operation $upload_op), polling..."
          poll "$base/submissions/draft/package/operations/%s" "$upload_op"
          echo "Upload processed."

          echo "Publishing the draft submission..."
          curl -sS -X POST -H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID" \
            -H "Content-Type: application/json" -d '{}' \
            -D "$headers" -o /dev/null "$base/submissions"
          publish_op="$(operation_id "$headers")"
          if [[ -z "$publish_op" ]]; then
            echo "error: publish did not return an operation Location header:" >&2
            cat "$headers" >&2
            exit 1
          fi
          echo "Publish accepted (operation $publish_op), polling..."
          poll "$base/submissions/operations/%s" "$publish_op"
          echo "Published."
