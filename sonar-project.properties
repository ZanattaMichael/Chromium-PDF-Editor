sonar.projectKey=ZanattaMichael_Chromium-PDF-Editor
sonar.organization=zanattamichael


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Chromium-PDF-Editor
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Build output, generated sources, and vendored/report directories should never be
# scanned as project source: obj/ holds MSBuild-generated .cs files (AssemblyInfo,
# GlobalUsings) that would otherwise be flagged as hand-written code, and the rest are
# reports or dependencies, not code this repo owns.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,coverage-report/**,coverage-results/**,dist/**,e2e/test-results/**,e2e/playwright-report/**

